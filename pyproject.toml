[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pmp"
version = "0.1.0"
description = "Prompt Management CLI"
readme = "README.md"
authors = [{ name = "PMP Contributors" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
test = ["pytest>=8.0"]

[project.scripts]
pmp = "pmp.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
