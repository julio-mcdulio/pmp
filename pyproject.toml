[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pmp"
version = "0.1.0"
description = "Prompt Management CLI"
readme = "README.md"
authors = [{ name = "PMP Contributors" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
test = ["pytest>=8.0"]
dotprompt = ["pluggy>=1.0", "dotpromptz==0.1.3"]

[project.scripts]
pmp = "pmp.cli:main"

[project.entry-points."pmp.plugins.storage"]
dotprompt = "pmp.plugins.storage.dotprompt:DotPromptBackendStoragePlugin"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "dotprompt: marks tests as dotprompt template engine tests (deselect with '-m \"not dotprompt\"')",
]
