[build-system]
requires = ["uv>=0.4.0"]
build-backend = "uv.build"

[project]
name = "pmp"
version = "0.1.0"
description = "Prompt Management CLI"
readme = "README.md"
authors = [{ name = "PMP Contributors" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[project.scripts]
pmp = "pmp.cli:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
